<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>GezyChat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #e9eef5;
        --surface: #ffffff;
        --surface-2: #f2f6fb;
        --ink: #13253d;
        --muted: #5d6f86;
        --faint: #8ba0ba;
        --line: #d9e2ee;
        --navy: #0c2a4d;
        --navy-2: #113863;
        --navy-deep: #081e38;
        --gold: #e9a819;
        --gold-soft: #fdf3d8;
        --gold-ink: #7c5600;
        --bubble-in: #ffffff;
        --bubble-out: #0c2a4d;
        --bubble-out-ink: #ffffff;
        --read: #1f9bd8;
        --online: #2fbf71;
        --chip-bg: #eef3fa;
        --chat-bg: #e7edf5;
        --shadow: 0 10px 30px rgba(8, 30, 56, 0.14);
        --radius: 18px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #060f1d;
          --surface: #0e1e35;
          --surface-2: #0a1729;
          --ink: #e9eff8;
          --muted: #9db0c9;
          --faint: #647b99;
          --line: #1d3353;
          --navy: #0e2c52;
          --navy-2: #143a6b;
          --navy-deep: #0a2140;
          --gold: #f2b52a;
          --gold-soft: #2b2310;
          --gold-ink: #f5cd6b;
          --bubble-in: #14293f;
          --bubble-out: #17507f;
          --bubble-out-ink: #ffffff;
          --read: #3db8f0;
          --chip-bg: #12263f;
          --chat-bg: #081426;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
      input, textarea { font: inherit; color: inherit; }
      svg { display: block; }
      button:focus-visible, input:focus-visible, textarea:focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 2px;
      }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }

      /* ---------- App frame ---------- */
      .app {
        height: 100dvh;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        max-width: 1440px;
        margin: 0 auto;
        background: var(--surface);
        position: relative;
        overflow: hidden;
      }
      @media (min-width: 920px) {
        .app {
          grid-template-columns: 380px minmax(0, 1fr);
          box-shadow: var(--shadow);
        }
      }

      /* ---------- Conversation list ---------- */
      .list-pane {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
        background: var(--surface);
        border-right: 1px solid var(--line);
      }
      .list-head {
        background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
        color: #fff;
        padding: calc(14px + env(safe-area-inset-top)) 18px 14px;
      }
      .list-head-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .list-head-row > div:nth-child(2) { flex: 1; min-width: 0; }
      .new-chat-btn {
        width: 42px; height: 42px; flex: none; border-radius: 50%;
        display: grid; place-items: center; color: #231a00; background: var(--gold);
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
      }
      .new-chat-btn:hover { filter: brightness(1.06); }
      .me-avatar {
        width: 42px; height: 42px; border-radius: 50%;
        background: var(--gold); color: #231a00;
        display: grid; place-items: center;
        font-weight: 800; font-size: 16px; flex: none;
        border: 2px solid rgba(255, 255, 255, 0.35);
      }
      .list-title { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.1; }
      .list-sub { font-size: 12.5px; color: rgba(255, 255, 255, 0.78); margin-top: 2px; }
      .search-wrap {
        margin-top: 14px;
        display: flex; align-items: center; gap: 9px;
        background: rgba(255, 255, 255, 0.13);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 999px;
        padding: 9px 14px;
      }
      .search-wrap svg { flex: none; opacity: 0.85; }
      .search-wrap input {
        flex: 1; min-width: 0;
        background: none; border: 0; outline: 0;
        color: #fff; font-size: 14.5px;
      }
      .search-wrap input::placeholder { color: rgba(255, 255, 255, 0.65); }
      .chips {
        display: flex; gap: 8px;
        padding: 12px 16px 10px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .chips::-webkit-scrollbar { display: none; }
      .chip {
        flex: none;
        padding: 7px 14px;
        border-radius: 999px;
        background: var(--chip-bg);
        color: var(--muted);
        font-size: 13px; font-weight: 600;
        border: 1px solid var(--line);
        transition: background 0.15s, color 0.15s;
      }
      .chip.active {
        background: var(--navy);
        color: #fff;
        border-color: var(--navy);
      }
      @media (prefers-color-scheme: dark) {
        .chip.active { background: var(--gold); color: #231a00; border-color: var(--gold); }
      }
      .chat-scroll { flex: 1; overflow-y: auto; min-height: 0; }
      .chat-item {
        width: 100%;
        display: flex; gap: 13px; align-items: center;
        padding: 13px 16px;
        text-align: left;
        border-bottom: 1px solid var(--line);
        transition: background 0.12s;
      }
      .chat-item:hover { background: var(--surface-2); }
      .chat-item.active { background: var(--gold-soft); }
      .avatar {
        width: 50px; height: 50px; border-radius: 50%;
        display: grid; place-items: center;
        font-weight: 700; font-size: 17px; color: #fff;
        flex: none; position: relative;
      }
      .avatar .dot {
        position: absolute; right: -1px; bottom: -1px;
        width: 13px; height: 13px; border-radius: 50%;
        background: var(--online);
        border: 2.5px solid var(--surface);
      }
      .chat-meta { flex: 1; min-width: 0; }
      .chat-top { display: flex; align-items: baseline; gap: 8px; }
      .chat-name {
        flex: 1; min-width: 0;
        font-weight: 700; font-size: 15.5px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .chat-time { font-size: 12px; color: var(--faint); flex: none; font-weight: 500; }
      .chat-time.unread { color: var(--gold-ink); font-weight: 800; }
      @media (prefers-color-scheme: dark) {
        .chat-time.unread { color: var(--gold); }
      }
      .chat-bottom { display: flex; align-items: center; gap: 7px; margin-top: 3px; }
      .chat-preview {
        flex: 1; min-width: 0;
        font-size: 13.5px; color: var(--muted);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .chat-preview .sender { color: var(--ink); font-weight: 600; }
      .preview-ticks { flex: none; display: inline-flex; }
      .badge {
        flex: none;
        min-width: 21px; height: 21px; padding: 0 6px;
        border-radius: 999px;
        background: var(--gold); color: #231a00;
        font-size: 12px; font-weight: 800;
        display: grid; place-items: center;
      }
      .list-empty {
        padding: 48px 24px; text-align: center; color: var(--muted); font-size: 14px;
      }

      /* ---------- Chat room ---------- */
      .room-pane {
        display: none;
        flex-direction: column;
        min-height: 0; min-width: 0;
        background: var(--chat-bg);
      }
      .room-pane.open { display: flex; }
      @media (min-width: 920px) {
        .room-pane { display: flex; }
        .list-pane.hidden-desktop { display: flex; }
      }
      @media (max-width: 919.5px) {
        .room-pane {
          position: absolute; inset: 0; z-index: 5;
        }
        .room-pane.open {
          display: flex;
          animation: roomIn 0.24s cubic-bezier(0.32, 0.72, 0.24, 1);
        }
      }
      @keyframes roomIn {
        from { opacity: 0; transform: translateX(28px); }
        to { opacity: 1; transform: none; }
      }
      .room-head {
        background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
        color: #fff;
        display: flex; align-items: center; gap: 11px;
        padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
        flex: none;
        box-shadow: 0 2px 10px rgba(8, 30, 56, 0.18);
        z-index: 2;
      }
      .back-btn {
        width: 38px; height: 38px; border-radius: 50%;
        display: grid; place-items: center; flex: none;
        margin-left: -6px;
      }
      .back-btn:hover { background: rgba(255, 255, 255, 0.14); }
      @media (min-width: 920px) { .back-btn { display: none; } }
      .room-avatar { width: 40px; height: 40px; font-size: 15px; }
      .room-who { flex: 1; min-width: 0; }
      .room-name {
        font-weight: 700; font-size: 16px; line-height: 1.15;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .room-status { font-size: 12.5px; color: rgba(255, 255, 255, 0.8); margin-top: 1px; }
      .room-status.typing { color: var(--gold); font-weight: 700; }

      .messages {
        flex: 1; overflow-y: auto; min-height: 0;
        padding: 18px 14px 10px;
        display: flex; flex-direction: column; gap: 3px;
        background-image: radial-gradient(rgba(12, 42, 77, 0.055) 1px, transparent 1.4px);
        background-size: 22px 22px;
      }
      @media (prefers-color-scheme: dark) {
        .messages { background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1.4px); }
      }
      @media (min-width: 920px) { .messages { padding: 22px 8% 12px; } }
      .day-sep {
        align-self: center;
        margin: 14px 0 12px;
        background: var(--surface);
        color: var(--muted);
        border: 1px solid var(--line);
        font-size: 12px; font-weight: 700;
        padding: 5px 13px; border-radius: 999px;
        box-shadow: 0 1px 3px rgba(8, 30, 56, 0.07);
      }
      .day-sep:first-child { margin-top: 0; }
      .row { display: flex; margin-top: 2px; }
      .row.out { justify-content: flex-end; }
      .row.grouped { margin-top: 0; }
      .bubble {
        max-width: min(78%, 520px);
        padding: 8px 11px 7px;
        border-radius: 16px;
        font-size: 14.5px; line-height: 1.45;
        position: relative;
        word-wrap: break-word;
        overflow-wrap: anywhere;
        box-shadow: 0 1px 2px rgba(8, 30, 56, 0.1);
        animation: pop 0.16s ease-out;
      }
      @keyframes pop {
        from { opacity: 0; transform: translateY(4px) scale(0.98); }
        to { opacity: 1; transform: none; }
      }
      .bubble.in {
        background: var(--bubble-in);
        border: 1px solid var(--line);
        border-bottom-left-radius: 5px;
      }
      .bubble.out {
        background: var(--bubble-out);
        color: var(--bubble-out-ink);
        border-bottom-right-radius: 5px;
      }
      .bubble .sender-name { font-size: 12.5px; font-weight: 800; margin-bottom: 2px; }
      .bubble .body { white-space: pre-wrap; }
      .bubble .meta {
        float: right;
        display: inline-flex; align-items: center; gap: 3px;
        margin: 8px 0 0 10px;
        font-size: 11px; line-height: 1;
        color: var(--faint);
        user-select: none;
      }
      .bubble.out .meta { color: rgba(255, 255, 255, 0.72); }
      .ticks { display: inline-flex; }
      .ticks.read { color: var(--read); }
      .bubble.out .ticks.read { color: #6fd2ff; }
      .message-state {
        max-width: 136px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 10.5px;
      }
      .message-state.waiting { color: var(--gold-ink); }
      .bubble.out .message-state.waiting { color: #ffd56e; }
      .message-state.sending { opacity: 0.86; }
      .retry-message {
        color: inherit;
        text-decoration: underline;
        font-size: 10.5px;
        font-weight: 700;
        padding: 0;
      }
      .reply-btn {
        position: absolute; top: -10px; right: 8px;
        width: 30px; height: 30px; border-radius: 50%;
        display: grid; place-items: center;
        background: var(--surface); color: var(--navy);
        border: 1px solid var(--line); box-shadow: 0 2px 7px rgba(8, 30, 56, 0.14);
        opacity: 0; transform: translateY(3px); transition: opacity 0.15s, transform 0.15s;
      }
      .bubble:hover .reply-btn, .bubble:focus-within .reply-btn { opacity: 1; transform: none; }
      .quoted-message {
        display: block; margin: 0 0 7px; padding: 5px 8px;
        border-left: 3px solid var(--gold); border-radius: 5px;
        background: rgba(12, 42, 77, 0.08); color: var(--muted);
        font-size: 12px; line-height: 1.35;
      }
      .bubble.out .quoted-message { background: rgba(255, 255, 255, 0.14); color: rgba(255, 255, 255, 0.82); }
      .quoted-message strong { display: block; color: inherit; font-size: 11px; }
      .upload-progress {
        height: 3px; border-radius: 99px; overflow: hidden;
        background: rgba(12, 42, 77, 0.16); margin: 6px 0 1px;
      }
      .bubble.out .upload-progress { background: rgba(255, 255, 255, 0.24); }
      .upload-progress > span { display: block; height: 100%; background: var(--gold); transition: width 0.2s ease; }

      /* attachment bubbles */
      .doc-card {
        display: flex; align-items: center; gap: 11px;
        background: rgba(12, 42, 77, 0.06);
        border: 1px solid var(--line);
        border-radius: 11px; padding: 9px 11px;
        margin-bottom: 6px; min-width: 210px;
      }
      .bubble.out .doc-card { background: rgba(255, 255, 255, 0.13); border-color: rgba(255, 255, 255, 0.25); }
      .doc-icon {
        width: 38px; height: 38px; border-radius: 9px; flex: none;
        background: #c0392b; color: #fff;
        display: grid; place-items: center;
        font-size: 10px; font-weight: 800; letter-spacing: 0.02em;
      }
      .doc-name { font-size: 13.5px; font-weight: 700; line-height: 1.25; }
      .doc-size { font-size: 11.5px; opacity: 0.75; margin-top: 1px; }
      .photo-frame { border-radius: 11px; overflow: hidden; margin-bottom: 6px; }
      .photo-frame svg { width: 100%; height: auto; }
      .photo-frame img { display: block; max-width: 100%; max-height: 310px; object-fit: cover; }

      /* voice note */
      .voice { display: flex; align-items: center; gap: 10px; min-width: 190px; padding: 2px 0 4px; }
      .voice-btn {
        width: 36px; height: 36px; border-radius: 50%; flex: none;
        background: var(--gold); color: #231a00;
        display: grid; place-items: center;
      }
      .bubble.in .voice-btn { background: var(--navy); color: #fff; }
      .voice-bars { display: flex; align-items: center; gap: 2.5px; flex: 1; height: 30px; }
      .voice-bars i {
        width: 3.5px; border-radius: 2px;
        background: currentColor; opacity: 0.35;
      }
      .voice-bars i.played { opacity: 0.95; }
      .voice-dur { font-size: 11.5px; opacity: 0.8; font-variant-numeric: tabular-nums; }
      .voice audio { width: 100%; min-width: 190px; height: 34px; }

      /* typing indicator */
      .typing-bubble { display: inline-flex; gap: 5px; align-items: center; padding: 13px 15px; }
      .typing-bubble i {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--faint);
        animation: blink 1.1s infinite;
      }
      .typing-bubble i:nth-child(2) { animation-delay: 0.18s; }
      .typing-bubble i:nth-child(3) { animation-delay: 0.36s; }
      @keyframes blink {
        0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
        30% { opacity: 1; transform: translateY(-3px); }
      }

      /* composer */
      .composer {
        flex: none;
        display: flex; align-items: flex-end; gap: 8px;
        padding: 9px 10px calc(9px + env(safe-area-inset-bottom));
        background: transparent;
        position: relative;
      }
      .composer-area { flex: none; position: relative; }
      .reply-bar, .attachment-preview, .recording-panel {
        margin: 0 10px;
        background: var(--surface);
        border: 1px solid var(--line);
        box-shadow: 0 1px 4px rgba(8, 30, 56, 0.07);
      }
      .reply-bar {
        display: flex; align-items: center; gap: 10px;
        border-radius: 14px 14px 0 0; border-bottom: 0; padding: 9px 12px;
      }
      .reply-accent { width: 3px; align-self: stretch; border-radius: 99px; background: var(--gold); }
      .reply-copy { flex: 1; min-width: 0; }
      .reply-to { color: var(--navy); font-size: 12px; font-weight: 800; }
      .reply-text { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
      .icon-close {
        width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none;
        color: var(--muted);
      }
      .icon-close:hover { background: var(--surface-2); color: var(--ink); }
      .attachment-preview {
        display: flex; align-items: center; gap: 10px;
        border-radius: 14px 14px 0 0; border-bottom: 0; padding: 8px 11px;
      }
      .attachment-preview img {
        width: 44px; height: 44px; object-fit: cover; border-radius: 9px; flex: none;
        background: var(--surface-2);
      }
      .attachment-preview .file-mark {
        width: 44px; height: 44px; border-radius: 9px; display: grid; place-items: center;
        background: #c0392b; color: #fff; font-size: 11px; font-weight: 800; flex: none;
      }
      .attachment-copy { flex: 1; min-width: 0; }
      .attachment-name { display: block; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .attachment-size { display: block; margin-top: 2px; font-size: 11.5px; color: var(--muted); }
      .recording-panel {
        display: flex; align-items: center; gap: 10px;
        border-radius: 14px 14px 0 0; border-bottom: 0; padding: 9px 12px;
      }
      .recording-dot { width: 10px; height: 10px; border-radius: 50%; background: #d84141; animation: recordPulse 1.15s ease-in-out infinite; }
      .recording-time { flex: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
      .recording-cancel, .recording-send {
        min-height: 36px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 800;
      }
      .recording-cancel { color: var(--muted); }
      .recording-send { background: var(--gold); color: #231a00; }
      @keyframes recordPulse { 50% { opacity: 0.4; transform: scale(0.76); } }
      .input-shell {
        flex: 1; min-width: 0;
        display: flex; align-items: flex-end;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: 0 1px 4px rgba(8, 30, 56, 0.07);
      }
      .attach-btn {
        width: 42px; height: 46px; flex: none;
        display: grid; place-items: center;
        color: var(--muted);
        border-radius: 50%;
      }
      .attach-btn:hover { color: var(--navy); }
      #msgInput {
        flex: 1; min-width: 0;
        border: 0; outline: 0; background: none; resize: none;
        padding: 13px 4px 13px 14px;
        font-size: 15px; line-height: 1.35;
        max-height: 120px;
      }
      #msgInput::placeholder { color: var(--faint); }
      .send-btn {
        width: 46px; height: 46px; border-radius: 50%; flex: none;
        background: var(--gold); color: #231a00;
        display: grid; place-items: center;
        box-shadow: 0 3px 10px rgba(233, 168, 25, 0.4);
        transition: transform 0.12s, background 0.15s;
      }
      .send-btn:active { transform: scale(0.92); }
      .send-btn.mic { background: var(--navy); color: #fff; box-shadow: 0 3px 10px rgba(12, 42, 77, 0.35); }

      .attach-menu {
        position: absolute;
        left: 12px; bottom: calc(66px + env(safe-area-inset-bottom));
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 8px;
        display: none;
        z-index: 6;
        min-width: 218px;
      }
      .attach-menu.open { display: block; animation: pop 0.15s ease-out; }
      .attach-menu button {
        width: 100%;
        display: flex; align-items: center; gap: 12px;
        padding: 10px 10px; border-radius: 11px;
        font-size: 14px; font-weight: 600; text-align: left;
      }
      .attach-menu button:hover { background: var(--surface-2); }
      .attach-ic {
        width: 38px; height: 38px; border-radius: 50%; flex: none;
        display: grid; place-items: center; color: #fff;
      }

      .room-placeholder {
        flex: 1; display: none;
        place-items: center; text-align: center;
        color: var(--muted); padding: 32px;
      }
      @media (min-width: 920px) {
        .room-placeholder.show { display: grid; }
        .room-content.hidden-desktop { display: none; }
      }
      .room-content { display: flex; flex-direction: column; flex: 1; min-height: 0; }
      .placeholder-badge {
        width: 84px; height: 84px; border-radius: 28px;
        background: var(--gold-soft); border: 1px solid var(--line);
        display: grid; place-items: center; margin: 0 auto 18px;
      }
      .load-older {
        align-self: center; min-height: 36px; padding: 0 13px; border-radius: 999px;
        background: var(--surface); border: 1px solid var(--line); color: var(--navy);
        font-size: 12px; font-weight: 800; box-shadow: 0 1px 3px rgba(8, 30, 56, 0.08);
      }
      .load-older[disabled] { opacity: 0.65; cursor: wait; }
      .thread-empty {
        align-self: center; max-width: 330px; margin: auto; padding: 22px;
        text-align: center; color: var(--muted); font-size: 13.5px; line-height: 1.5;
      }
      .network-banner {
        position: absolute; top: calc(8px + env(safe-area-inset-top)); left: 50%; z-index: 20;
        transform: translateX(-50%); max-width: calc(100% - 24px);
        display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px;
        color: #fff; background: #9d6511; box-shadow: var(--shadow); font-size: 12.5px; font-weight: 700;
      }
      .network-banner i { width: 8px; height: 8px; flex: none; border-radius: 50%; background: #ffe08b; }
      .toast {
        position: absolute; z-index: 30; bottom: calc(80px + env(safe-area-inset-bottom)); left: 50%;
        transform: translate(-50%, 12px); max-width: min(440px, calc(100% - 24px));
        padding: 10px 14px; border-radius: 12px; background: var(--navy-deep); color: #fff;
        box-shadow: var(--shadow); font-size: 13px; opacity: 0; pointer-events: none;
        transition: opacity 0.18s, transform 0.18s;
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }
      dialog {
        width: min(460px, calc(100% - 28px)); padding: 0; border: 0; border-radius: 20px;
        color: var(--ink); background: var(--surface); box-shadow: var(--shadow);
      }
      dialog::backdrop { background: rgba(8, 30, 56, 0.54); backdrop-filter: blur(2px); }
      .dialog-head { display: flex; align-items: center; gap: 12px; padding: 18px 18px 12px; }
      .dialog-head h2 { flex: 1; margin: 0; font-size: 18px; }
      .dialog-body { padding: 4px 18px 18px; }
      .dialog-copy { margin: 0 0 15px; color: var(--muted); font-size: 13px; line-height: 1.45; }
      .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
      .type-choice {
        min-height: 42px; border: 1px solid var(--line); border-radius: 11px; color: var(--muted);
        font-size: 13px; font-weight: 800;
      }
      .type-choice.active { background: var(--gold-soft); border-color: var(--gold); color: var(--gold-ink); }
      .form-field { display: block; margin: 12px 0; }
      .form-field > span:first-child { display: block; margin-bottom: 6px; font-size: 12.5px; font-weight: 800; }
      .form-field input, .form-field textarea {
        width: 100%; border: 1px solid var(--line); border-radius: 11px; outline: 0;
        background: var(--surface-2); padding: 11px 12px; font-size: 14px;
      }
      .form-field textarea { min-height: 74px; resize: vertical; }
      .form-help, .form-error { min-height: 18px; margin: 5px 0 0; font-size: 11.5px; }
      .form-help { color: var(--muted); }
      .form-error { color: #b42318; font-weight: 700; }
      .dialog-actions { display: flex; justify-content: flex-end; gap: 9px; padding-top: 6px; }
      .dialog-actions button { min-height: 40px; padding: 0 15px; border-radius: 10px; font-size: 13px; font-weight: 800; }
      .dialog-cancel { color: var(--muted); }
      .dialog-submit { background: var(--navy); color: #fff; }
      @media (max-width: 919.5px) {
        .reply-btn { opacity: 0.88; transform: none; }
        .new-chat-btn, .back-btn, .attach-btn, .send-btn { min-width: 44px; min-height: 44px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .bubble, .attach-menu.open, .room-pane.open, .recording-dot { animation: none; }
        .typing-bubble i { animation: none; opacity: 0.7; }
      }
    </style>

  <body>
    <div class="app">
      <div class="network-banner" id="networkBanner" role="status" hidden>
        <i aria-hidden="true"></i>
        Anda sedang offline. Pesan baru akan dikirim saat jaringan kembali.
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

      <!-- ============ CONVERSATION LIST ============ -->
      <aside class="list-pane" id="listPane">
        <header class="list-head">
          <div class="list-head-row">
            <div class="me-avatar" aria-hidden="true">G</div>
            <div>
              <div class="list-title">Percakapan</div>
              <div class="list-sub" id="listSub">Memuat…</div>
            </div>
            <button class="new-chat-btn" id="newChatBtn" type="button" aria-label="Mulai percakapan atau grup baru">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
          <label class="search-wrap">
            <span class="sr-only">Cari percakapan</span>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
            <input id="searchInput" type="search" placeholder="Cari nama atau pesan…" autocomplete="off" aria-label="Cari percakapan" />
          </label>
        </header>
        <nav class="chips" aria-label="Filter percakapan">
          <button class="chip active" data-filter="semua" aria-pressed="true">Semua</button>
          <button class="chip" data-filter="belum" aria-pressed="false">Belum dibaca</button>
          <button class="chip" data-filter="grup" aria-pressed="false">Grup</button>
          <button class="chip" data-filter="pribadi" aria-pressed="false">Pribadi</button>
        </nav>
        <div class="chat-scroll" id="chatList" role="list"></div>
      </aside>

      <!-- ============ CHAT ROOM ============ -->
      <section class="room-pane" id="roomPane" aria-label="Ruang chat">
        <div class="room-placeholder" id="roomPlaceholder">
          <div>
            <div class="placeholder-badge">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--gold-ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
            </div>
            <p style="font-weight:700; font-size:17px; color:var(--ink); margin:0 0 6px;">Pilih percakapan</p>
            <p style="margin:0; font-size:14px;">Klik salah satu percakapan di sebelah kiri untuk mulai mengobrol.</p>
          </div>
        </div>

        <div class="room-content" id="roomContent" hidden>
          <header class="room-head">
            <button class="back-btn" id="backBtn" aria-label="Kembali ke daftar chat">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>
            </button>
            <div class="avatar room-avatar" id="roomAvatar">?</div>
            <div class="room-who">
              <div class="room-name" id="roomName">—</div>
              <div class="room-status" id="roomStatus">—</div>
            </div>
          </header>

          <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions text" aria-label="Pesan percakapan"></div>

          <div class="composer-area">
            <div class="reply-bar" id="replyBar" hidden>
              <span class="reply-accent" aria-hidden="true"></span>
              <div class="reply-copy">
                <span class="reply-to" id="replyTo">Membalas pesan</span>
                <span class="reply-text" id="replyText"></span>
              </div>
              <button class="icon-close" id="cancelReplyBtn" type="button" aria-label="Batalkan balasan">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m18 6-12 12M6 6l12 12"/></svg>
              </button>
            </div>
            <div class="attachment-preview" id="attachmentPreview" hidden>
              <div id="attachmentThumb"></div>
              <div class="attachment-copy">
                <span class="attachment-name" id="attachmentName"></span>
                <span class="attachment-size" id="attachmentSize"></span>
              </div>
              <button class="icon-close" id="removeAttachmentBtn" type="button" aria-label="Hapus lampiran">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m18 6-12 12M6 6l12 12"/></svg>
              </button>
            </div>
            <div class="recording-panel" id="recordingPanel" hidden>
              <span class="recording-dot" aria-hidden="true"></span>
              <span class="recording-time" id="recordingTime">0:00</span>
              <button class="recording-cancel" id="cancelRecordingBtn" type="button">Batal</button>
              <button class="recording-send" id="sendRecordingBtn" type="button">Kirim</button>
            </div>
            <form class="composer" id="composer" autocomplete="off">
              <div class="attach-menu" id="attachMenu" role="menu" aria-label="Pilih jenis lampiran">
                <button type="button" data-attach="foto" role="menuitem">
                  <span class="attach-ic" style="background:#7d4fc9;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L6 21"/></svg></span>
                  Foto kegiatan
                </button>
                <button type="button" data-attach="dokumen" role="menuitem">
                  <span class="attach-ic" style="background:#c0392b;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg></span>

                </button>
                <button type="button" data-attach="suara" role="menuitem">
                  <span class="attach-ic" style="background:#1f8a5b;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 1-14 0v-1"/><path d="M12 18v4"/></svg></span>
                  Pesan suara
                </button>
              </div>
              <div class="input-shell">
                <textarea id="msgInput" rows="1" placeholder="Tulis pesan…" aria-label="Tulis pesan"></textarea>
                <button type="button" class="attach-btn" id="attachBtn" aria-label="Lampirkan file" aria-haspopup="menu" aria-controls="attachMenu" aria-expanded="false">
                  <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                </button>
              </div>
              <button type="submit" class="send-btn mic" id="sendBtn" aria-label="Rekam pesan suara">
                <svg id="sendIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                <svg id="micIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 1-14 0v-1"/><path d="M12 18v4"/></svg>
              </button>
            </form>
            <input id="attachmentInput" type="file" hidden tabindex="-1" />
          </div>
        </div>
      </section>
    </div>

    <dialog id="newChatDialog" aria-labelledby="newChatTitle">
      <form id="newChatForm" novalidate>
        <div class="dialog-head">

    </dialog>

      /* ================= Reply, send state, and reconnect ================= */
      function pilihBalasan(chat, pesan) {
        state.balasan = {
          chatId: chat.id,
          messageId: pesan.id,
          pengirim: namaPengirim(chat, pesan),
          teks: ringkasPesan(pesan)
        };
        replyToEl.textContent = "Membalas " + state.balasan.pengirim;
        replyTextEl.textContent = state.balasan.teks;
        replyBarEl.hidden = false;
        inputEl.focus({ preventScroll: true });
      }
      function batalkanBalasan() {
        state.balasan = null;
        replyBarEl.hidden = true;
      }
      function replyUntukChat(chat) {
        if (!state.balasan || state.balasan.chatId !== chat.id) return null;
        return {
          messageId: state.balasan.messageId,
          pengirim: state.balasan.pengirim,
          teks: state.balasan.teks
        };
      }
      function tambahPesan(chat, pesan) {
        var sebelumnyaKosong = chat.pesan.length === 0;
        chat.pesan.push(pesan);
        if (state.aktif === chat.id) {
          if (sebelumnyaKosong) {
            renderPesan(chat);
            renderDaftar();
            return;
          }
          var previous = chat.pesan[chat.pesan.length - 2];
          var row = buatBubble(chat, pesan);
          if (previous && previous.dari === pesan.dari && labelHari(previous.ts) === labelHari(pesan.ts)) {
            row.classList.add("grouped");
          }
          messagesEl.appendChild(row);
          gulirBawah(true);
        }
        renderDaftar();
      }
      function perbaruiStatus(chat, pesan, status, progress) {
        pesan.status = status;
        if (typeof progress === "number") pesan.progress = progress;
        if (state.aktif === chat.id) {
          var bubble = messagesEl.querySelector('[data-mid="' + pesan.id + '"]');
          if (bubble) {
            var slot = bubble.querySelector(".status-slot");
            if (slot) slot.innerHTML = statusHtml(pesan);
            var progressEl = bubble.querySelector(".upload-progress");
            if (pesan.status === "mengunggah") {
              if (!progressEl) {
                progressEl = el("div", "upload-progress", "<span></span>");
                bubble.insertBefore(progressEl, bubble.querySelector(".meta"));
              }
              progressEl.firstChild.style.width = Math.min(100, Math.max(0, pesan.progress || 0)) + "%";
            } else if (progressEl) {
              progressEl.parentNode.removeChild(progressEl);
            }
          }
        }
        renderDaftar();
      }
      function tandaiMenunggu(chat, pesan) {
        perbaruiStatus(chat, pesan, "menunggu");
      }
      function selesaiMengirim(chat, pesan, percobaan) {
        if (pesan.deliveryAttempt !== percobaan) return;
        if (!sedangOnline()) {
          tandaiMenunggu(chat, pesan);
          return;
        }
        perbaruiStatus(chat, pesan, "terkirim-satu");
        setTimeout(function () {
          if (pesan.deliveryAttempt !== percobaan || pesan.status === "menunggu") return;
          perbaruiStatus(chat, pesan, "terkirim");
        }, 440);
        setTimeout(function () {
          if (pesan.deliveryAttempt !== percobaan || pesan.status === "menunggu") return;
          perbaruiStatus(chat, pesan, "dibaca");
        }, 1080);
        jadwalkanBalasan(chat);
      }
      function mulaiPengiriman(chat, pesan) {
        if (!sedangOnline()) {
          tandaiMenunggu(chat, pesan);
          return;
        }
        var percobaan = (pesan.deliveryAttempt || 0) + 1;
        pesan.deliveryAttempt = percobaan;

        if (pesan.tipe) {
          perbaruiStatus(chat, pesan, "mengunggah", 8);
          setTimeout(function () {
            if (pesan.deliveryAttempt !== percobaan) return;
            if (!sedangOnline()) return tandaiMenunggu(chat, pesan);
            perbaruiStatus(chat, pesan, "mengunggah", 42);
          }, 220);
          setTimeout(function () {
            if (pesan.deliveryAttempt !== percobaan) return;
            if (!sedangOnline()) return tandaiMenunggu(chat, pesan);
            perbaruiStatus(chat, pesan, "mengunggah", 78);
          }, 480);
          setTimeout(function () {
            if (pesan.deliveryAttempt !== percobaan) return;
            selesaiMengirim(chat, pesan, percobaan);
          }, 760);
          return;
        }

        perbaruiStatus(chat, pesan, "mengirim");
        setTimeout(function () {
          selesaiMengirim(chat, pesan, percobaan);
        }, 360);
      }
      function kirimPesan(teks) {
        var chat = state.aktif ? chatById(state.aktif) : null;
        if (!chat) return;
        var pesan = {
          id: idBaru(),
          dari: "keluar",
          teks: teks,
          ts: Date.now(),
          status: sedangOnline() ? "mengirim" : "menunggu",
          reply: replyUntukChat(chat)
        };
        tambahPesan(chat, pesan);
        batalkanBalasan();
        mulaiPengiriman(chat, pesan);
      }
      function kirimLampiranAktif(teks) {
        var chat = state.aktif ? chatById(state.aktif) : null;
        var lampiran = state.lampiran;
        if (!chat || !lampiran) return false;

        state.lampiran = null;
        renderLampiranAktif();
        var pesan = {
          id: idBaru(),
          dari: "keluar",
          tipe: lampiran.tipe,
          namaFile: lampiran.nama,
          ukuran: lampiran.ukuran,
          mediaUrl: lampiran.url,
          teks: teks || "",
          ts: Date.now(),
          status: sedangOnline() ? "mengunggah" : "menunggu",
          progress: 0,
          reply: replyUntukChat(chat)
        };
        tambahPesan(chat, pesan);
        batalkanBalasan();
        mulaiPengiriman(chat, pesan);
        return true;
      }
      function kirimPesanSuara(url, durasi) {
        var chat = state.aktif ? chatById(state.aktif) : null;
        if (!chat) return;
        var pesan = {
          id: idBaru(),
          dari: "keluar",
          tipe: "suara",
          audioUrl: url,
          durasi: durasi,
          ts: Date.now(),
          status: sedangOnline() ? "mengunggah" : "menunggu",
          progress: 0,
          reply: replyUntukChat(chat)
        };
        tambahPesan(chat, pesan);
        batalkanBalasan();
        mulaiPengiriman(chat, pesan);
      }
      function kirimUlang(chat, pesan) {
        if (!chat || !pesan || pesan.dari !== "keluar") return;
        if (!sedangOnline()) {
          tandaiMenunggu(chat, pesan);
          tampilkanToast("Belum ada jaringan. Pesan akan dicoba lagi saat online.");
          return;
        }
        mulaiPengiriman(chat, pesan);
      }
      function lanjutkanPesanTertunda() {
        CHATS.forEach(function (chat) {
          chat.pesan.forEach(function (pesan) {
            if (pesan.dari === "keluar" && pesan.status === "menunggu") {
              mulaiPengiriman(chat, pesan);
            }
          });
        });
      }

      var mengetikRow = null;
      function tampilkanMengetik(chat) {
        if (state.aktif !== chat.id) return;
        sembunyikanMengetik();
        roomStatusEl.textContent = "mengetik…";
        roomStatusEl.classList.add("typing");
        mengetikRow = el("div", "row in");
        mengetikRow.id = "typingRow";
        mengetikRow.innerHTML = '<div class="bubble in typing-bubble"><i></i><i></i><i></i></div>';
        messagesEl.appendChild(mengetikRow);
        gulirBawah(true);
      }
      function sembunyikanMengetik() {
        if (mengetikRow && mengetikRow.parentNode) mengetikRow.parentNode.removeChild(mengetikRow);
        mengetikRow = null;
        var chat = state.aktif ? chatById(state.aktif) : null;
        if (chat) {
          roomStatusEl.textContent = statusTeks(chat);
          roomStatusEl.classList.remove("typing");
        }
      }
      function jadwalkanBalasan(chat) {
        if (!sedangOnline() || !chat.balasan || !chat.balasan.length) return;
        var delay = 1300 + Math.random() * 1200;
        setTimeout(function () {
          if (!sedangOnline()) return;
          tampilkanMengetik(chat);
          var typingFor = 1100 + Math.random() * 1400;
          setTimeout(function () {
            if (!sedangOnline()) {
              sembunyikanMengetik();
              return;
            }
            sembunyikanMengetik();
            var text = chat.balasan[chat.balasanIdx % chat.balasan.length];
            chat.balasanIdx += 1;
            var incoming = { dari: "masuk", teks: text, ts: Date.now(), id: idBaru() };
            if (chat.grup && chat.pengirimGrup && chat.pengirimGrup.length) {
              incoming.pengirim = chat.pengirimGrup[chat.pengirimIdx % chat.pengirimGrup.length];
              chat.pengirimIdx += 1;
            }
            var opened = state.aktif === chat.id;
            tambahPesan(chat, incoming);
            if (!opened) {
              chat.belumDibaca += 1;
              renderDaftar();
            }
          }, typingFor);
        }, delay);
      }

      /* ================= Attachment and voice note ================= */
      var composer = $("#composer");
      var attachMenu = $("#attachMenu");
      var attachBtn = $("#attachBtn");
      var attachmentInput = $("#attachmentInput");

      function setMenuLampiran(terbuka) {
        attachMenu.classList.toggle("open", terbuka);
        attachBtn.setAttribute("aria-expanded", terbuka ? "true" : "false");
        if (terbuka) {
          var first = attachMenu.querySelector("button");
          if (first) setTimeout(function () { first.focus(); }, 0);
        }
      }
      function renderLampiranAktif() {
        var lampiran = state.lampiran;
        attachmentThumbEl.innerHTML = "";
        if (!lampiran) {
          attachmentPreviewEl.hidden = true;
          segarkanTombolKirim();
          return;
        }
        if (lampiran.tipe === "foto") {
          var image = document.createElement("img");
          image.src = lampiran.url;
          image.alt = "Pratinjau foto " + lampiran.nama;
          attachmentThumbEl.appendChild(image);
        } else {
          attachmentThumbEl.appendChild(el("div", "file-mark", "PDF"));
        }
        attachmentNameEl.textContent = lampiran.nama;
        attachmentSizeEl.textContent = lampiran.ukuran;
        attachmentPreviewEl.hidden = false;
        segarkanTombolKirim();
      }
      function hapusLampiran() {
        if (state.lampiran && state.lampiran.url) URL.revokeObjectURL(state.lampiran.url);
        state.lampiran = null;
        attachmentInput.value = "";
        renderLampiranAktif();
      }
      function pilihLampiran(tipe) {
        if (!state.aktif) {
          tampilkanToast("Pilih percakapan sebelum menambahkan lampiran.");
          return;
        }
        if (state.rekaman) return;
        attachmentInput.dataset.tipe = tipe;
        attachmentInput.accept = tipe === "foto" ? "image/*" : "application/pdf";
        attachmentInput.click();
      }
      function terimaLampiran(file, tipe) {
        if (!file) return;
        var batas = tipe === "foto" ? 5 * 1024 * 1024 : 20 * 1024 * 1024;
        var tipeValid = tipe === "foto" ? file.type.indexOf("image/") === 0 : file.type === "application/pdf";
        if (!tipeValid) {
          tampilkanToast(tipe === "foto" ? "Pilih file gambar yang valid." : "Pilih dokumen PDF.");
          return;
        }
        if (file.size > batas) {
          tampilkanToast(tipe === "foto" ? "Ukuran foto maksimal 5 MB." : "Ukuran dokumen maksimal 20 MB.");
          return;
        }
        hapusLampiran();
        state.lampiran = {
          tipe: tipe,
          nama: file.name || (tipe === "foto" ? "Foto" : "Dokumen.pdf"),
          ukuran: formatUkuran(file.size),
          url: URL.createObjectURL(file)
        };
        renderLampiranAktif();
        inputEl.focus({ preventScroll: true });
      }
      function tampilkanPanelRekam() {
        recordingPanelEl.hidden = false;
        inputEl.disabled = true;
        attachBtn.disabled = true;
        sendBtn.disabled = true;
      }
      function sembunyikanPanelRekam() {
        recordingPanelEl.hidden = true;
        inputEl.disabled = false;
        attachBtn.disabled = false;
        sendBtn.disabled = false;
        segarkanTombolKirim();
      }
      function mulaiRekam() {
        if (!state.aktif) {
          tampilkanToast("Pilih percakapan sebelum merekam pesan suara.");
          return;
        }
        if (state.rekaman) return;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
          tampilkanToast("Perekaman suara belum didukung oleh browser ini.");
          return;
        }
        setMenuLampiran(false);
        navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
          var recorder;
          try {
            recorder = new MediaRecorder(stream);
          } catch (error) {
            stream.getTracks().forEach(function (track) { track.stop(); });
            tampilkanToast("Perekaman suara tidak dapat dimulai di browser ini.");
            return;
          }
          var rekaman = {
            recorder: recorder,
            stream: stream,
            chunks: [],
            mulai: Date.now(),
            kirim: false,
            timer: null
          };
          recorder.addEventListener("dataavailable", function (event) {
            if (event.data && event.data.size) rekaman.chunks.push(event.data);
          });
          recorder.addEventListener("stop", function () {
            if (rekaman.timer) clearInterval(rekaman.timer);
            stream.getTracks().forEach(function (track) { track.stop(); });
            sembunyikanPanelRekam();
            state.rekaman = null;
            if (!rekaman.kirim) {
              tampilkanToast("Rekaman dibatalkan.");
              return;
            }
            if (!rekaman.chunks.length) {
              tampilkanToast("Tidak ada audio yang direkam. Coba lagi.");
              return;
            }
            var durasi = Math.max(1, Math.round((Date.now() - rekaman.mulai) / 1000));
            var blob = new Blob(rekaman.chunks, { type: recorder.mimeType || "audio/webm" });
            kirimPesanSuara(URL.createObjectURL(blob), durasi);
          });
          state.rekaman = rekaman;
          recorder.start(250);
          tampilkanPanelRekam();
          rekaman.timer = setInterval(function () {
            recordingTimeEl.textContent = formatDurasi(Math.max(0, Math.floor((Date.now() - rekaman.mulai) / 1000)));
          }, 250);
          recordingTimeEl.textContent = "0:00";
        }).catch(function () {
          tampilkanToast("Izin mikrofon diperlukan untuk merekam pesan suara.");
        });
      }
      function berhentiRekam(kirim) {
        var rekaman = state.rekaman;
        if (!rekaman) return;
        rekaman.kirim = kirim;
        if (rekaman.recorder.state !== "inactive") rekaman.recorder.stop();
      }

      /* ================= New conversation dialog ================= */
      var newChatDialog = $("#newChatDialog");
      var newChatForm = $("#newChatForm");
      var newChatNameEl = $("#newChatName");
      var newChatNameLabelEl = $("#newChatNameLabel");
      var groupFieldsEl = $("#groupFields");
      var groupMembersEl = $("#groupMembers");
      var newChatErrorEl = $("#newChatError");
      function setTipePercakapanBaru(tipe) {
        state.tipePercakapanBaru = tipe;
        document.querySelectorAll("[data-conversation-type]").forEach(function (button) {
          var aktif = button.dataset.conversationType === tipe;
          button.classList.toggle("active", aktif);
          button.setAttribute("aria-pressed", aktif ? "true" : "false");
        });
        var grup = tipe === "group";
        groupFieldsEl.hidden = !grup;
        newChatNameLabelEl.textContent = grup ? "Nama grup" : "Nama kontak";
        newChatNameEl.placeholder = grup ? "Contoh: Koordinasi Kelas 7A" : "Contoh: Bu Ani Kurnia";
        $("#createChatBtn").textContent = grup ? "Buat grup" : "Mulai chat";
        newChatErrorEl.textContent = "";
      }
      function bukaDialogChatBaru() {
        newChatForm.reset();
        setTipePercakapanBaru("direct");
        if (typeof newChatDialog.showModal === "function") {
          newChatDialog.showModal();
          setTimeout(function () { newChatNameEl.focus(); }, 0);
        } else {
          tampilkanToast("Browser ini belum mendukung dialog percakapan baru.");
        }
      }
      function tutupDialogChatBaru() {
        if (newChatDialog.open) newChatDialog.close();
      }
      function slugPercakapan(nama) {
        var slug = nama.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
        return (slug || "percakapan") + "-" + Date.now();
      }
      function buatPercakapanBaru() {
        var nama = newChatNameEl.value.trim().replace(/\s+/g, " ");
        var grup = state.tipePercakapanBaru === "group";
        if (!nama) {
          newChatErrorEl.textContent = grup ? "Masukkan nama grup." : "Masukkan nama kontak.";
          newChatNameEl.focus();
          return;
        }
        var anggota = [];
        if (grup) {
          anggota = groupMembersEl.value.split(/[,\n]/).map(function (item) {
            return item.trim().replace(/\s+/g, " ");
          }).filter(Boolean);
          var unik = [];
          var namaNormal = [];
          anggota.forEach(function (item) {
            var normal = item.toLowerCase();
            if (namaNormal.indexOf(normal) === -1) {
              namaNormal.push(normal);
              unik.push(item);
            }
          });
          anggota = unik;
          if (anggota.length < 2) {
            newChatErrorEl.textContent = "Masukkan setidaknya dua anggota grup.";
            groupMembersEl.focus();
            return;
          }
          if (anggota.length > 50) {
            newChatErrorEl.textContent = "Maksimal 50 anggota grup.";
            groupMembersEl.focus();
            return;
          }
        }

        var chat = {
          id: slugPercakapan(nama),
          nama: nama,
          peran: grup ? "Grup · " + (anggota.length + 1) + " anggota" : "Kontak baru",
          grup: grup,
          online: false,
          terakhirAktif: grup ? anggota.slice(0, 3).join(", ") + (anggota.length > 3 ? " +" + (anggota.length - 3) + " lainnya" : "") : "terakhir dilihat belum tersedia",
          belumDibaca: 0,
          pesan: [],
          createdAt: Date.now(),
          hasOlder: false,
          pengirimGrup: grup ? anggota : []
        };
        siapkanChat(chat, CHATS.length);
        CHATS.push(chat);
        tutupDialogChatBaru();
        renderDaftar();
        bukaChat(chat.id);
        tampilkanToast(grup ? "Grup baru dibuat." : "Percakapan baru siap digunakan.");
      }

      /* ================= Event wiring ================= */
      function segarkanTombolKirim() {
        var adaIsi = inputEl.value.trim().length > 0 || Boolean(state.lampiran);
        sendBtn.classList.toggle("mic", !adaIsi);
        sendBtn.setAttribute("aria-label", adaIsi ? "Kirim pesan" : "Rekam pesan suara");
        sendIcon.style.display = adaIsi ? "block" : "none";
        micIcon.style.display = adaIsi ? "none" : "block";
      }
      function aturTinggi() {
        inputEl.style.height = "auto";
        inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
      }

      messagesEl.addEventListener("click", function (event) {
        var target = event.target.closest("button");
        if (!target) return;
        if (target.dataset.replyMsg) {
          var chat = state.aktif ? chatById(state.aktif) : null;
          var pesan = chat ? pesanById(chat, target.dataset.replyMsg) : null;
          if (chat && pesan) pilihBalasan(chat, pesan);
          return;
        }
        if (target.dataset.retryMsg) {
          var retryChat = state.aktif ? chatById(state.aktif) : null;
          var retryPesan = retryChat ? pesanById(retryChat, target.dataset.retryMsg) : null;
          kirimUlang(retryChat, retryPesan);
          return;
        }
        if (target.dataset.loadOlder) muatPesanLama(chatById(target.dataset.loadOlder));
      });
      $("#cancelReplyBtn").addEventListener("click", batalkanBalasan);
      $("#removeAttachmentBtn").addEventListener("click", hapusLampiran);
      $("#cancelRecordingBtn").addEventListener("click", function () { berhentiRekam(false); });
      $("#sendRecordingBtn").addEventListener("click", function () { berhentiRekam(true); });

      inputEl.addEventListener("input", function () {
        segarkanTombolKirim();
        aturTinggi();
      });
      inputEl.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          composer.requestSubmit();
        }
      });
      composer.addEventListener("submit", function (event) {
        event.preventDefault();
        if (state.rekaman) return;
        var teks = inputEl.value.trim();
        if (state.lampiran) {
          if (kirimLampiranAktif(teks)) {
            inputEl.value = "";
            segarkanTombolKirim();
            aturTinggi();
            inputEl.focus({ preventScroll: true });
          }
          return;
        }
        if (!teks) {
          mulaiRekam();
          return;
        }
        inputEl.value = "";
        segarkanTombolKirim();
        aturTinggi();
        kirimPesan(teks);
        inputEl.focus({ preventScroll: true });
      });
      attachBtn.addEventListener("click", function (event) {
        event.stopPropagation();
        setMenuLampiran(!attachMenu.classList.contains("open"));
      });
      document.addEventListener("click", function (event) {
        if (!attachMenu.contains(event.target) && !attachBtn.contains(event.target)) setMenuLampiran(false);
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && attachMenu.classList.contains("open")) {
          event.preventDefault();
          setMenuLampiran(false);
          attachBtn.focus();
        }
      });
      attachMenu.addEventListener("keydown", function (event) {
        var buttons = Array.prototype.slice.call(attachMenu.querySelectorAll("button"));
        var current = buttons.indexOf(document.activeElement);
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          var next = event.key === "ArrowDown" ? current + 1 : current - 1;
          if (next < 0) next = buttons.length - 1;
          if (next >= buttons.length) next = 0;
          buttons[next].focus();
        }
      });
      attachMenu.querySelectorAll("[data-attach]").forEach(function (button) {
        button.addEventListener("click", function () {
          var tipe = button.dataset.attach;
          setMenuLampiran(false);
          if (tipe === "suara") mulaiRekam();
          else pilihLampiran(tipe);
        });
      });
      attachmentInput.addEventListener("change", function () {
        var file = attachmentInput.files && attachmentInput.files[0];
        var tipe = attachmentInput.dataset.tipe;
        attachmentInput.value = "";
        if (file && tipe) terimaLampiran(file, tipe);
      });

      $("#backBtn").addEventListener("click", tutupChat);
      $("#searchInput").addEventListener("input", function (event) {
        state.cari = event.target.value;
        renderDaftar();
      });
      document.querySelectorAll(".chip").forEach(function (chip) {
        chip.addEventListener("click", function () {
          document.querySelectorAll(".chip").forEach(function (item) {

            item.classList.toggle("active", aktif);
            item.setAttribute("aria-pressed", aktif ? "true" : "false");
          });
          state.filter = chip.dataset.filter;
          renderDaftar();
        });
      });

      $("#newChatBtn").addEventListener("click", bukaDialogChatBaru);
      $("#closeNewChatBtn").addEventListener("click", tutupDialogChatBaru);
      $("#cancelNewChatBtn").addEventListener("click", tutupDialogChatBaru);
      document.querySelectorAll("[data-conversation-type]").forEach(function (button) {
        button.addEventListener("click", function () { setTipePercakapanBaru(button.dataset.conversationType); });
      });
      newChatForm.addEventListener("submit", function (event) {
        event.preventDefault();
        buatPercakapanBaru();
      });

      window.addEventListener("offline", function () {
        perbaruiTampilanJaringan();
        tampilkanToast("Anda sedang offline. Pesan baru disimpan sebagai antrean.");
      });
      window.addEventListener("online", function () {
        perbaruiTampilanJaringan();
        lanjutkanPesanTertunda();
        tampilkanToast("Jaringan kembali. Pesan tertunda sedang dikirim.");
      });
      window.addEventListener("resize", function () {
        if (window.innerWidth >= 920 && !state.aktif) {
          roomContent.hidden = true;
          roomPlaceholder.classList.add("show");
        }
      });

      /* ================= Init ================= */
      renderDaftar();
      roomContent.hidden = true;
      if (window.innerWidth >= 920) roomPlaceholder.classList.add("show");
      perbaruiTampilanJaringan();
      segarkanTombolKirim();
    </script>
  </body>
</html>
